name: Automatic Release on Push to Main

on:
  push:
    branches:
      - main # Runs only on pushes to the main branch

permissions:
  contents: write # Required to create tags and GitHub Releases

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Fetch full history so we can resolve previous tags.
          fetch-depth: 0

      - name: Get Version from package.json
        id: get_version
        run: echo "VERSION=$(node -p \"require('./package.json').version\")" >> $GITHUB_OUTPUT

      - name: Check if tag already exists
        # If a tag already exists for this version, skip to avoid errors.
        run: |
          if git rev-parse "v${{ steps.get_version.outputs.VERSION }}" >/dev/null 2>&1; then
            echo "Tag v${{ steps.get_version.outputs.VERSION }} already exists. Skipping release."
            exit 78 # Special exit code to skip subsequent steps.
          fi

      - name: Extract Release Notes from CHANGELOG
        id: extract_notes
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          # Extract notes for the current version from CHANGELOG.md.
          # It starts printing after the matching header and stops at the next version header.
          awk '/^## \['"$VERSION"'\]/{flag=1; next} /^## \[/{flag=0} flag' CHANGELOG.md > releasenotes.md
          
          # Fail if no matching section was found.
          if [ ! -s releasenotes.md ]; then
            echo "Error: Release notes for version v${VERSION} not found in CHANGELOG.md."
            exit 1
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        # Runs only if the tag did not already exist.
        if: success()
        with:
          # Create the tag and GitHub Release.
          tag_name: "v${{ steps.get_version.outputs.VERSION }}"
          name: "Release v${{ steps.get_version.outputs.VERSION }}"
          # Use notes extracted into a temporary file.
          body_path: "releasenotes.md"
          # Attach built userscripts to the release.
          files: |
            dist/youtubespeedx.userscript.js
            dist/youtubespeedx.userscript.min.js
          token: ${{ secrets.GITHUB_TOKEN }}
